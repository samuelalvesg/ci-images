name: Build image (reusable)

on:
  workflow_call:
    inputs:
      name:
        description: Image name under ghcr.io/samuelalvesg/ (flutter, rust, flutter-rust, dotnet)
        required: true
        type: string
      version:
        description: Version tag (tool version this image carries, e.g. 3.47.9)
        required: true
        type: string
      context:
        required: true
        type: string
      build_args:
        description: Newline-separated KEY=VALUE build arguments
        type: string
        default: ""
      test_command:
        description: "Smoke test command; receives the image reference as $IMAGE"
        required: true
        type: string
      description:
        required: true
        type: string
      publish:
        description: Push to GHCR (false = build and test only)
        type: boolean
        default: false
      floating_tags:
        description: Also move `<major>.<minor>` and `latest`
        type: boolean
        default: true
      base_image_name:
        description: Image name whose :<version> tag is the BASE build argument (flutter-rust builds on flutter)
        type: string
        default: ""
      free_disk_space:
        description: Remove preinstalled toolchains from the runner before building (needed by the large Android image)
        type: boolean
        default: false
      versions:
        description: "Newline-separated `Label=command` pairs run inside the image for the job summary (first output line is the version)"
        type: string
        default: ""
    outputs:
      image:
        value: ${{ jobs.build.outputs.image }}

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      image: ${{ steps.ref.outputs.image }}
      skipped: ${{ steps.reuse.outputs.skip }}
    steps:
      - uses: actions/checkout@v7

      - name: Start time (for the job summary)
        id: clock
        run: echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"

      # The large Android image (base + SDK + NDK + Gradle cache + build cache) needs about 30 GB. The ubuntu-24.04 runner has
      # 145 GB of disk and about 78 GB free (measured), so the preinstalled toolchains are removed only when the free space is
      # below 40 GB. Removing them unconditionally took 92 s. Only the two largest are removed: the many small files of the
      # tool cache are what makes the removal slow.
      - name: Free disk space (only if needed)
        if: inputs.free_disk_space
        run: |
          df -h / | tail -1
          free_gb=$(df --output=avail -BG / | tail -1 | tr -dc '0-9')
          if [ "$free_gb" -lt 40 ]; then
            echo "only ${free_gb} GB free: removing the preinstalled Android SDK and .NET"
            sudo rm -rf /usr/local/lib/android /usr/share/dotnet
            df -h / | tail -1
          else
            echo "${free_gb} GB free: nothing to remove"
          fi

      - name: Resolve image reference and tags
        id: ref
        env:
          NAME: ${{ inputs.name }}
          VERSION: ${{ inputs.version }}
          FLOATING: ${{ inputs.floating_tags }}
          OWNER: ${{ github.repository_owner }}
        run: |
          owner="$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/$owner/$NAME"
          minor="${VERSION%.*}"
          tags="$image:$VERSION"$'\n'"$image:$minor-sha-${GITHUB_SHA::7}"
          if [ "$FLOATING" = "true" ]; then tags="$tags"$'\n'"$image:$minor"$'\n'"$image:latest"; fi
          {
            echo "owner=$owner"
            echo "image=$image:$VERSION"
            echo "tags<<EOF"; echo "$tags"; echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A push to main or a pull request does not rebuild an image whose inputs did not change: the published image carries
      # a `content-<hash>` tag, and if that tag already exists the image was already built and tested with exactly these
      # inputs, so the build, tests and push are skipped. The hash covers the context files, the build args, the version,
      # the digest of the published base image, the test command and this workflow file itself, so a change to any of them
      # rebuilds. A manual run always rebuilds (it also picks up base-image updates, which the hash cannot see for the
      # ubuntu and dotnet bases).
      - name: Content hash and reuse check
        id: reuse
        env:
          CONTEXT: ${{ inputs.context }}
          ARGS: ${{ inputs.build_args }}
          TEST_COMMAND: ${{ inputs.test_command }}
          VERSION: ${{ inputs.version }}
          BASE: ${{ inputs.base_image_name != '' && format('ghcr.io/{0}/{1}:{2}', steps.ref.outputs.owner, inputs.base_image_name, inputs.version) || '' }}
          REPO: ghcr.io/${{ steps.ref.outputs.owner }}/${{ inputs.name }}
          CAN_SKIP: ${{ github.event_name != 'workflow_dispatch' }}
        run: |
          base_digest=""
          if [ -n "$BASE" ]; then
            base_digest="$(docker buildx imagetools inspect "$BASE" --format '{{.Manifest.Digest}}' 2>/dev/null || true)"
          fi
          hash="$( { find "$CONTEXT" -type f | LC_ALL=C sort | xargs sha256sum; sha256sum .github/workflows/_build-image.yml; printf '%s\n' "$ARGS" "$TEST_COMMAND" "$VERSION" "$base_digest"; } | sha256sum | cut -c1-16 )"
          tag="$REPO:content-$hash"
          skip=false
          if [ "$CAN_SKIP" = "true" ] && docker buildx imagetools inspect "$tag" >/dev/null 2>&1; then skip=true; fi
          { echo "hash=$hash"; echo "skip=$skip"; echo "tag=$tag"; echo "base_digest=$base_digest"; } >> "$GITHUB_OUTPUT"

      - name: OCI labels
        id: labels
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ steps.ref.outputs.owner }}/${{ inputs.name }}
          labels: |
            org.opencontainers.image.title=${{ inputs.name }}
            org.opencontainers.image.description=${{ inputs.description }}
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.vendor=${{ github.repository_owner }}
            org.opencontainers.image.documentation=${{ github.server_url }}/${{ github.repository }}/blob/${{ github.sha }}/README.md

      - name: Build (local, for the smoke test)
        if: steps.reuse.outputs.skip != 'true'
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          build-args: |
            ${{ inputs.build_args }}
            ${{ inputs.base_image_name != '' && format('BASE=ghcr.io/{0}/{1}:{2}', steps.ref.outputs.owner, inputs.base_image_name, inputs.version) || '' }}
          labels: ${{ steps.labels.outputs.labels }}
          tags: ${{ steps.ref.outputs.image }}
          load: true
          # Layer cache lives in the registry (tag `buildcache` of the same package), not in the Actions cache: that one is
          # limited to 10 GB per repository and the Android image alone is about 11 GB, so it was evicted before being reused.
          # Pull requests read it too; only runs that can write to the registry (not forks, not Dependabot) update it.
          cache-from: type=registry,ref=${{ format('ghcr.io/{0}/{1}:buildcache', steps.ref.outputs.owner, inputs.name) }}
          cache-to: ${{ github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && format('type=registry,ref=ghcr.io/{0}/{1}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true', steps.ref.outputs.owner, inputs.name) || '' }}

      - name: Smoke test
        if: steps.reuse.outputs.skip != 'true'
        env:
          IMAGE: ${{ steps.ref.outputs.image }}
        run: ${{ inputs.test_command }}

      - name: Lint Dockerfile
        if: steps.reuse.outputs.skip != 'true'
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: ${{ inputs.context }}/Dockerfile
          config: .hadolint.yaml
          failure-threshold: error

      # Report only for now: base images carry unfixed CVEs that would block every publish. The scan only reports, so neither its
      # findings nor a failure of the scanner itself (the large Android image hit the default 5 minute limit and took the
      # publication down with it) may stop the push: `continue-on-error`, and the job summary says whether it finished.
      # Vulnerabilities only (no secret scanning, which is what made the 11 GB image slow) and a limit of 15 minutes.
      # Only when publishing: on the largest image it took 223 s of every pull request run. The result of a publication is in
      # the job log of the run on main.
      - name: Scan image for vulnerabilities
        id: scan
        if: inputs.publish && steps.reuse.outputs.skip != 'true'
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ${{ steps.ref.outputs.image }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
          format: table
          scanners: vuln
          timeout: 15m
      - name: Push all tags
        id: push
        if: inputs.publish && steps.reuse.outputs.skip != 'true'
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          build-args: |
            ${{ inputs.build_args }}
            ${{ inputs.base_image_name != '' && format('BASE=ghcr.io/{0}/{1}:{2}', steps.ref.outputs.owner, inputs.base_image_name, inputs.version) || '' }}
          labels: ${{ steps.labels.outputs.labels }}
          tags: |
            ${{ steps.ref.outputs.tags }}
            ${{ steps.reuse.outputs.tag }}
          push: true
          provenance: mode=max
          sbom: true
          cache-from: type=registry,ref=${{ format('ghcr.io/{0}/{1}:buildcache', steps.ref.outputs.owner, inputs.name) }}

      # Signed provenance needs a public repository (or an Enterprise plan); skipped silently otherwise.
      - name: Attest build provenance
        if: inputs.publish && steps.reuse.outputs.skip != 'true' && github.event.repository.private == false
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ steps.ref.outputs.owner }}/${{ inputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      # Never fails the job (it only reports) and also runs when an earlier step failed.
      - name: Job summary
        if: always()
        continue-on-error: true
        env:
          NAME: ${{ inputs.name }}
          VERSION: ${{ inputs.version }}
          IMAGE: ${{ steps.ref.outputs.image }}
          TAGS: ${{ steps.ref.outputs.tags }}
          DIGEST: ${{ steps.push.outputs.digest }}
          HASH: ${{ steps.reuse.outputs.hash }}
          HASH_TAG: ${{ steps.reuse.outputs.tag }}
          BASE: ${{ inputs.base_image_name != '' && format('ghcr.io/{0}/{1}:{2}', steps.ref.outputs.owner, inputs.base_image_name, inputs.version) || '' }}
          BASE_DIGEST: ${{ steps.reuse.outputs.base_digest }}
          VERSIONS: ${{ inputs.versions }}
          PUBLISH: ${{ inputs.publish }}
          SKIPPED: ${{ steps.reuse.outputs.skip }}
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
          JOB_STATUS: ${{ job.status }}
          STARTED: ${{ steps.clock.outputs.started }}
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .github/scripts/build-summary.sh

  # Proves the pushed image works as a `container:` of a job (HOME swapped, checkout owned by another uid).
  use-as-ci-container:
    needs: build
    if: inputs.publish && needs.build.outputs.skipped != 'true'
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.build.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - name: Container is usable
        run: git status --short >/dev/null && echo ok
