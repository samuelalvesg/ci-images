name: CI images

# One workflow publishes the whole CI toolchain: flutter -> flutter-rust (built on top of it), plus rust and dotnet.
# Pull requests only build and test. Publishing needs a push to main or a manual run.
on:
  workflow_dispatch:
    inputs:
      flutter_version:
        description: Flutter stable version
        required: true
        default: "3.50.0"
      dotnet_version:
        description: ".NET SDK channel (major.minor)"
        required: true
        default: "10.0"
      publish_floating_tags:
        description: Also move `latest` and `<major>.<minor>`
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - "docker/**"
      - ".github/workflows/flutter-image.yml"
      - ".github/workflows/_build-image.yml"
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - "docker/**"
      - ".github/workflows/flutter-image.yml"
      - ".github/workflows/_build-image.yml"

permissions:
  contents: read

concurrency:
  group: ci-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Draft pull requests skip every job below (they all depend on this one), so pushes to a draft cost no CI minutes.
  versions:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    outputs:
      flutter: ${{ steps.v.outputs.flutter }}
      dotnet: ${{ steps.v.outputs.dotnet }}
      publish: ${{ steps.v.outputs.publish }}
      floating: ${{ steps.v.outputs.floating }}
    steps:
      - id: v
        env:
          FLUTTER: ${{ inputs.flutter_version }}
          DOTNET: ${{ inputs.dotnet_version }}
          FLOATING: ${{ inputs.publish_floating_tags }}
        run: |
          {
            echo "flutter=${FLUTTER:-3.50.0}"
            echo "dotnet=${DOTNET:-10.0}"
            echo "floating=${FLOATING:-true}"
            if [ "${{ github.event_name }}" = "pull_request" ]; then echo "publish=false"; else echo "publish=true"; fi
          } >> "$GITHUB_OUTPUT"

  flutter:
    needs: versions
    permissions: { contents: read, packages: write, id-token: write, attestations: write }
    uses: ./.github/workflows/_build-image.yml
    with:
      name: flutter
      version: ${{ needs.versions.outputs.flutter }}
      context: docker/flutter-image
      build_args: FLUTTER_VERSION=${{ needs.versions.outputs.flutter }}
      description: "Flutter SDK (stable, web) on Ubuntu 24.04 - ready-to-use Docker image for GitHub Actions CI and Coolify/Docker builds. Tags: X.Y.Z, X.Y, latest"
      versions: |
        Flutter=flutter --version | head -1
        Dart=dart --version
        Ubuntu=. /etc/os-release && echo "$PRETTY_NAME"
        Git=git --version
      test_command: docker/flutter-image/test.sh "$IMAGE" "${{ needs.versions.outputs.flutter }}"
      publish: ${{ needs.versions.outputs.publish == 'true' }}
      floating_tags: ${{ needs.versions.outputs.floating == 'true' }}

  # Builds FROM the published flutter image, so it only runs when that one was pushed. In pull requests the `rust` job
  # validates the same Dockerfile.
  flutter-rust:
    needs: [versions, flutter]
    if: needs.versions.outputs.publish == 'true'
    permissions: { contents: read, packages: write, id-token: write, attestations: write }
    uses: ./.github/workflows/_build-image.yml
    with:
      name: flutter-rust
      version: ${{ needs.versions.outputs.flutter }}
      context: docker/rust-image
      base_image_name: flutter
      build_args: WITH_APP_TOOLS=true
      description: "Flutter + Rust (stable, pinned nightly, wasm32), flutter_rust_bridge_codegen, wasm-pack, wasm-opt and protoc - Docker image for Flutter web/WASM CI with native Rust. Tags: X.Y.Z, X.Y, latest"
      versions: |
        Flutter=flutter --version | head -1
        Dart=dart --version
        Rust (stable)=rustc --version
        Rust (nightly)=rustc +"$(rustup toolchain list | grep nightly | cut -d' ' -f1)" --version
        flutter_rust_bridge_codegen=flutter_rust_bridge_codegen --version
        wasm-pack=wasm-pack --version
        wasm-opt=wasm-opt --version
        protoc=protoc --version
      test_command: docker/rust-image/test.sh "$IMAGE" flutter
      publish: ${{ needs.versions.outputs.publish == 'true' }}
      floating_tags: ${{ needs.versions.outputs.floating == 'true' }}

  # Platform images built on flutter-rust. In pull requests flutter-rust is skipped, so these build on the version of it
  # that is already published; on a publish run they wait for the new flutter-rust.
  flutter-linux:
    needs: [versions, flutter-rust]
    if: ${{ !cancelled() && needs.versions.result == 'success' && needs.flutter-rust.result != 'failure' }}
    permissions: { contents: read, packages: write, id-token: write, attestations: write }
    uses: ./.github/workflows/_build-image.yml
    with:
      name: flutter-linux
      version: ${{ needs.versions.outputs.flutter }}
      context: docker/linux-image
      base_image_name: flutter-rust
      description: "Flutter + Rust + Linux desktop toolchain (GTK3, gstreamer, libsecret, appindicator) - Docker image to build Flutter apps for Linux in CI. Tags: X.Y.Z, X.Y, latest"
      versions: |
        Flutter=flutter --version | head -1
        Dart=dart --version
        Rust (stable)=rustc --version
        flutter_rust_bridge_codegen=flutter_rust_bridge_codegen --version
        CMake=cmake --version
        Clang=clang --version
        GTK 3=pkg-config --modversion gtk+-3.0
        Ninja=ninja --version
      test_command: docker/linux-image/test.sh "$IMAGE"
      publish: ${{ needs.versions.outputs.publish == 'true' }}
      floating_tags: ${{ needs.versions.outputs.floating == 'true' }}
      free_disk_space: true

  flutter-android:
    needs: [versions, flutter-rust]
    if: ${{ !cancelled() && needs.versions.result == 'success' && needs.flutter-rust.result != 'failure' }}
    permissions: { contents: read, packages: write, id-token: write, attestations: write }
    uses: ./.github/workflows/_build-image.yml
    with:
      name: flutter-android
      version: ${{ needs.versions.outputs.flutter }}
      context: docker/android-image
      base_image_name: flutter-rust
      description: "Flutter + Rust + Android toolchain (JDK 17, SDK 36, NDK 28.2, Rust Android targets) - Docker image to build Flutter APKs and app bundles in CI. Tags: X.Y.Z, X.Y, latest"
      versions: |
        Flutter=flutter --version | head -1
        Dart=dart --version
        Rust (stable)=rustc --version
        flutter_rust_bridge_codegen=flutter_rust_bridge_codegen --version
        Java=java -version
        Android platform=ls "$ANDROID_HOME/platforms"
        Build tools=ls "$ANDROID_HOME/build-tools" | sort -V | tail -1
        NDK=ls "$ANDROID_HOME/ndk"
        Gradle (baked in)=ls "$GRADLE_USER_HOME/wrapper/dists" | grep "^gradle-" | head -1
        Rust targets=rustup target list --installed | tr '\n' ' '
      test_command: docker/android-image/test.sh "$IMAGE"
      publish: ${{ needs.versions.outputs.publish == 'true' }}
      floating_tags: ${{ needs.versions.outputs.floating == 'true' }}
      free_disk_space: true

  rust:
    needs: versions
    permissions: { contents: read, packages: write, id-token: write, attestations: write }
    uses: ./.github/workflows/_build-image.yml
    with:
      name: rust
      version: "1.0.0"
      context: docker/rust-image
      description: "Rust (stable + pinned nightly, wasm32, clippy, rustfmt), flutter_rust_bridge_codegen and wasm-pack preinstalled - Docker image for Rust/WASM CI. Tags: 1.0.0, 1.0, latest"
      versions: |
        Rust (stable)=rustc --version
        Rust (nightly)=rustc +"$(rustup toolchain list | grep nightly | cut -d' ' -f1)" --version
        flutter_rust_bridge_codegen=flutter_rust_bridge_codegen --version
        wasm-pack=wasm-pack --version
      test_command: docker/rust-image/test.sh "$IMAGE"
      publish: ${{ needs.versions.outputs.publish == 'true' }}
      floating_tags: ${{ needs.versions.outputs.floating == 'true' }}

  dotnet:
    needs: versions
    permissions: { contents: read, packages: write, id-token: write, attestations: write }
    uses: ./.github/workflows/_build-image.yml
    with:
      name: dotnet
      version: ${{ needs.versions.outputs.dotnet }}.0
      context: docker/dotnet-image
      build_args: DOTNET_VERSION=${{ needs.versions.outputs.dotnet }}
      description: ".NET SDK (10.0) with dotnet-ef, python3 and jq preinstalled - Docker image for ASP.NET/EF Core CI on GitHub Actions. Tags: X.Y.Z, X.Y, latest"
      versions: |
        .NET SDK=dotnet --version
        dotnet-ef=dotnet-ef --version
        Python=python3 --version
        jq=jq --version
        Git=git --version
      test_command: docker/dotnet-image/test.sh "$IMAGE" "${{ needs.versions.outputs.dotnet }}"
      publish: ${{ needs.versions.outputs.publish == 'true' }}
      floating_tags: ${{ needs.versions.outputs.floating == 'true' }}
